# ── Autenticación: DecapBridge (editores por email, sin GitHub) ──
backend:
  name: git-gateway
  repo: Iron-Biker-s/iron-bikers-landing
  branch: main
  identity_url: https://auth.decapbridge.com/sites/47a26b47-c1a8-44c1-a12a-ed189fa9eb0f
  gateway_url: https://gateway.decapbridge.com

# Quién hizo cada cambio (opcional)
commit_messages:
  create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
  uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
  openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Logo Decap + Bridge (opcional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# ── LOCAL vs PRODUCCIÓN ──────────────────────────────────────────
# En desarrollo local: pon `true` aquí, corre `bun run cms:local`
# y entra a http://localhost:4321/admin/index.html
# En producción: debe quedar `false` para que el panel use DecapBridge.
local_backend: false

media_folder: "public/images"
public_folder: "/images"

site_url: https://www.ironbikers.co

admin_css:
  - /admin/admin.css

collections:
  # ─────────────────────────── Grupo A ───────────────────────────
  # Configuraciones de secciones: 1 archivo por sección.
  - name: site
    identifier_field: siteName
    label: "Configuración del sitio"
    folder: "src/content/site"
    create: false
    delete: false
    format: json
    extension: json
    editor:
      preview: false
    fields:
      - { label: "Nombre del club", name: "siteName", widget: "string" }
      - { label: "Nombre corto", name: "siteNameShort", widget: "string" }
      - { label: "Descripción (SEO)", name: "description", widget: "text" }
      - { label: "Ciudad", name: "city", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "NIT", name: "nit", widget: "string" }
      - { label: "URL Política de privacidad", name: "privacyUrl", widget: "string" }
      - { label: "URL Eliminar cuenta", name: "deleteAccountUrl", widget: "string" }

  - name: social
    label: "Redes sociales"
    identifier_field: label
    folder: "src/content/social"
    create: false
    delete: false
    format: json
    extension: json
    editor:
      preview: false
    fields:
      - { label: "Etiqueta", name: "label", widget: "string", default: "Redes sociales" }
      - label: "Instagram"
        name: "instagram"
        widget: "object"
        fields:
          - { label: "Handle (ej: @club)", name: "handle", widget: "string", required: false }
          - { label: "URL", name: "url", widget: "string", required: false }
      - label: "Facebook"
        name: "facebook"
        widget: "object"
        fields:
          - { label: "Handle", name: "handle", widget: "string", required: false }
          - { label: "URL", name: "url", widget: "string", required: false }
      - label: "TikTok"
        name: "tiktok"
        widget: "object"
        fields:
          - { label: "Handle", name: "handle", widget: "string", required: false }
          - { label: "URL", name: "url", widget: "string", required: false }
      - label: "WhatsApp"
        name: "whatsapp"
        widget: "object"
        fields:
          - { label: "Handle (ej: Grupo oficial)", name: "handle", widget: "string", required: false }
          - { label: "URL", name: "url", widget: "string", required: false }

  - name: hero
    identifier_field: title
    label: "Hero (portada)"
    folder: "src/content/hero"
    create: false
    delete: false
    format: json
    extension: json
    editor:
      preview: false
    fields:
      - { label: "Badge", name: "badge", widget: "string", hint: "Dejar vacío para ocultarlo" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Título destacado (2ª línea)", name: "titleSpan", widget: "string" }
      - { label: "Frase", name: "quote", widget: "string" }
      - { label: "Logo (círculo)", name: "logo", widget: "image", choose_url: false }
      - { label: "Texto alternativo del logo", name: "logoAlt", widget: "string" }
      - { label: "Imagen de fondo", name: "bgImage", widget: "image", choose_url: false }
      - label: "Estadísticas"
        name: "stats"
        widget: "list"
        fields:
          - { label: "Valor (ej: 50+)", name: "value", widget: "string" }
          - { label: "Etiqueta (ej: Miembros)", name: "label", widget: "string" }

  - name: statusbar
    identifier_field: rodada
    label: "Barra de rodada"
    folder: "src/content/statusbar"
    create: false
    delete: false
    format: json
    extension: json
    editor:
      preview: false
    fields:
      - { label: "Próxima rodada", name: "rodada", widget: "string" }
      - { label: "Destino", name: "destino", widget: "string" }
      - { label: "Cupos", name: "cupos", widget: "string" }

  - name: about
    identifier_field: titleLine1
    label: "Nosotros"
    folder: "src/content/about"
    create: false
    delete: false
    format: json
    extension: json
    editor:
      preview: false
    fields:
      - { label: "Título (línea 1)", name: "titleLine1", widget: "string" }
      - { label: "Título (línea 2)", name: "titleLine2", widget: "string" }
      - { label: "Texto", name: "text", widget: "text" }
      - { label: "Cita", name: "quote", widget: "string" }

  - name: benefits
    identifier_field: titleLine1
    label: "Membresía / Beneficios"
    folder: "src/content/benefits"
    create: false
    delete: false
    format: json
    extension: json
    editor:
      preview: false
    fields:
      - { label: "Título (línea 1)", name: "titleLine1", widget: "string" }
      - { label: "Título (línea 2)", name: "titleLine2", widget: "string" }
      - { label: "Imagen", name: "image", widget: "image", choose_url: false }
      - { label: "Texto alternativo (accesibilidad)", name: "imageAlt", widget: "string" }
      - label: "Beneficios"
        name: "items"
        widget: "list"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
          - { label: "Destacado (punto dorado)", name: "featured", widget: "boolean", default: false }

  - name: jersey
    identifier_field: titleLine1
    label: "Jersey"
    folder: "src/content/jersey"
    create: false
    delete: false
    format: json
    extension: json
    editor:
      preview: false
    fields:
      - { label: "Título (línea 1)", name: "titleLine1", widget: "string" }
      - { label: "Título (línea 2)", name: "titleLine2", widget: "string" }
      - { label: "Texto", name: "text", widget: "text" }
      - { label: "Texto del botón", name: "button", widget: "string" }
      - { label: "Texto del sello (ej: Edición Limitada)", name: "badge", widget: "string" }
      - { label: "Imagen", name: "image", widget: "image", choose_url: false }
      - { label: "Texto alternativo (accesibilidad)", name: "imageAlt", widget: "string" }

  - name: contact
    identifier_field: titleLine1
    label: "Sección de contacto"
    folder: "src/content/contact"
    create: false
    delete: false
    format: json
    extension: json
    editor:
      preview: false
    fields:
      - { label: "Título (línea 1)", name: "titleLine1", widget: "string" }
      - { label: "Título (línea 2)", name: "titleLine2", widget: "string" }
      - { label: "Etiqueta Nombre", name: "nameLabel", widget: "string" }
      - { label: "Etiqueta Teléfono", name: "phoneLabel", widget: "string" }
      - { label: "Etiqueta Marca", name: "marcaLabel", widget: "string" }
      - { label: "Etiqueta Modelo", name: "modeloLabel", widget: "string" }
      - { label: "Etiqueta Placa", name: "placaLabel", widget: "string" }
      - { label: "Texto del botón", name: "submitLabel", widget: "string" }

  - name: footer
    identifier_field: copyright
    label: "Pie de página"
    folder: "src/content/footer"
    create: false
    delete: false
    format: json
    extension: json
    editor:
      preview: false
    fields:
      - { label: "Copyright", name: "copyright", widget: "string" }
      - { label: "NIT", name: "nit", widget: "string" }
      - { label: "Línea del club (footer)", name: "clubLine", widget: "string" }

  # ─────────────────────────── Grupo B ───────────────────────────
  # Contenido con múltiples entradas.

  - name: sections
    label: "Títulos de secciones"
    folder: "src/content/sections"
    create: false
    delete: false
    format: json
    extension: json
    identifier_field: leadersTitle
    editor:
      preview: false
    fields:
      - { label: "Directivos — título", name: "leadersTitle", widget: "string" }
      - { label: "Directivos — subtítulo", name: "leadersSubtitle", widget: "text" }
      - { label: "Eventos — título", name: "eventsTitle", widget: "string" }
      - { label: "Eventos — subtítulo", name: "eventsSubtitle", widget: "text" }
      - { label: "Testimonios — título", name: "testimonialsTitle", widget: "string" }
      - { label: "Aliados — título", name: "alliancesTitle", widget: "string" }
      - { label: "Aliados — subtítulo", name: "alliancesSubtitle", widget: "text" }
      - { label: "Galería — título (1ª parte)", name: "galleryTitle", widget: "string" }
      - { label: "Galería — título (2ª parte)", name: "galleryTitleSpan", widget: "string" }
      - { label: "Galería — subtítulo", name: "gallerySubtitle", widget: "string" }
      - { label: "Noticias — título", name: "newsTitle", widget: "string" }
      - { label: "Noticias — título (2ª parte)", name: "newsTitleSpan", widget: "string" }
      - { label: "Noticias — subtítulo", name: "newsSubtitle", widget: "string" }

  - name: values
    identifier_field: title
    label: "Valores"
    label_singular: "Valor"
    folder: "src/content/values"
    create: true
    delete: true
    format: json
    extension: json
    slug: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: "Número", name: "number", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Desplazado (escalonado)", name: "shifted", widget: "boolean", default: false }

  - name: pilots
    identifier_field: name
    label: "Pilotos y directiva"
    label_singular: "Piloto"
    folder: "src/content/pilots"
    create: true
    delete: true
    format: json
    extension: json
    slug: "{{name}}"
    editor:
      preview: false
    fields:
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Cargo / Rol", name: "role", widget: "string" }
      - { label: "Grupo", name: "group", widget: "string", default: "Directiva" }
      - { label: "Foto", name: "image", widget: "image", choose_url: false }
      - { label: "Texto alternativo (accesibilidad)", name: "alt", widget: "string" }

  - name: events
    label: "Eventos"
    label_singular: "Evento"
    folder: "src/content/events"
    create: true
    delete: true
    format: json
    extension: json
    slug: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Etiqueta corta (ej: Rodada Costera)", name: "tag", widget: "string" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options: ["Rodadas", "Ironman", "Entrenamiento", "Social", "Gastronomía"]
      - { label: "Imagen", name: "image", widget: "image", choose_url: false }
      - { label: "Texto alternativo (accesibilidad)", name: "alt", widget: "string" }

  - name: testimonials
    identifier_field: name
    label: "Testimonios"
    label_singular: "Testimonio"
    folder: "src/content/testimonials"
    create: true
    delete: true
    format: json
    extension: json
    slug: "{{name}}"
    editor:
      preview: false
    fields:
      - { label: "Cita", name: "quote", widget: "text" }
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Rol (ej: Miembro)", name: "role", widget: "string" }
      - { label: "Foto", name: "image", widget: "image", choose_url: false }
      - { label: "Texto alternativo (accesibilidad)", name: "alt", widget: "string" }

  - name: alliances
    identifier_field: name
    label: "Aliados"
    label_singular: "Aliado"
    folder: "src/content/alliances"
    create: true
    delete: true
    format: json
    extension: json
    slug: "{{name}}"
    editor:
      preview: false
    fields:
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Categoría", name: "category", widget: "string" }
      - { label: "Logo", name: "logo", widget: "image", choose_url: false }
      - { label: "Texto alternativo (accesibilidad)", name: "alt", widget: "string" }

  - name: gallery
    identifier_field: title
    label: "Galería"
    label_singular: "Foto"
    folder: "src/content/gallery"
    create: true
    delete: true
    format: json
    extension: json
    slug: "{{title}}"
    editor:
      preview: false
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Categoría", name: "category", widget: "string" }
      - { label: "Imagen", name: "image", widget: "image", choose_url: false }
      - { label: "Texto alternativo (accesibilidad)", name: "alt", widget: "string" }

  - name: news
    label: "Noticias"
    label_singular: "Noticia"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: "Título", name: "title", widget: "string", hint: "Título de la noticia" }
      - { label: "Fecha", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Autor", name: "author", widget: "string", default: "Iron Biker's" }
      - { label: "Resumen", name: "summary", widget: "text", hint: "2-3 líneas que se muestran en la lista" }
      - label: "Etiquetas"
        name: "tags"
        widget: "list"
        default: ["club"]
        field: { label: "Etiqueta", name: "tag", widget: "string" }
      - { label: "Imagen de portada", name: "cover", widget: "image", choose_url: false }
      - { label: "Contenido", name: "body", widget: "markdown" }
